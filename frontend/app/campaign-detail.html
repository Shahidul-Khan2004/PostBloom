<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PostBloom Campaign Detail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="app.css">
</head>
<body class="app-body" data-page="campaign-detail">
  <div class="mobile-overlay"></div>
  <nav class="app-nav">
    <div class="app-nav-inner">
      <div class="app-brand">
        <button class="sidebar-toggle" data-sidebar-toggle aria-label="Open navigation">☰</button>
        <a class="app-logo" href="dashboard.html" aria-label="PostBloom home"></a>
        <span class="workspace-name">Bloom Labs Creator Team</span>
      </div>
      <div class="app-nav-actions">
        <button class="icon-button" aria-label="Notifications">🔔<span class="notification-badge">6</span></button>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">🌙</button>
        <div class="avatar-menu">
          <button class="avatar-button" data-avatar-menu aria-label="Open user menu">AK</button>
          <div class="dropdown-menu">
            <a href="profile.html">Profile</a>
            <a href="#">Settings</a>
            <a href="../index.html">Logout</a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <div class="app-shell">
    <div class="app-layout">
      <aside class="sidebar glass">
        <div class="sidebar-nav">
          <a class="sidebar-link" href="dashboard.html">📊 Dashboard</a>
          <a class="sidebar-link" href="opportunities.html">🔥 Opportunity Feed</a>
          <a class="sidebar-link active" href="campaign-new.html">🗂️ Campaigns</a>
          <a class="sidebar-link" href="team.html">👥 Team</a>
          <a class="sidebar-link" href="import.html">⬆️ Import Analytics</a>
        </div>
      </aside>

      <main class="app-main">
        <section class="campaign-header-card glass" id="campaignHeader"></section>

        <div class="tab-bar" role="tablist" aria-label="Campaign sections">
          <button class="tab-button" id="overviewTab" role="tab" aria-controls="overviewPanel" aria-selected="false" tabindex="-1" data-tab="overviewPanel">Overview</button>
          <button class="tab-button active" id="deliverablesTab" role="tab" aria-controls="deliverablesPanel" aria-selected="true" data-tab="deliverablesPanel">Deliverables</button>
          <button class="tab-button" id="activityTab" role="tab" aria-controls="activityPanel" aria-selected="false" tabindex="-1" data-tab="activityPanel">Activity</button>
        </div>

        <section class="tab-panel" id="overviewPanel" role="tabpanel" aria-labelledby="overviewTab">
          <div id="campaignOverview"></div>
        </section>

        <section class="tab-panel active" id="deliverablesPanel" role="tabpanel" aria-labelledby="deliverablesTab">
          <div class="deliverables-list" id="deliverablesList"></div>
        </section>

        <section class="tab-panel" id="activityPanel" role="tabpanel" aria-labelledby="activityTab">
          <div class="activity-card glass">
            <div class="card-header">
              <h2>Campaign Activity</h2>
            </div>
            <div class="activity-list" id="campaignActivity"></div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
