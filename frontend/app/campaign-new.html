<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PostBloom New Campaign</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="app.css">
</head>
<body class="app-body" data-page="campaign-new">
  <div class="mobile-overlay"></div>
  <nav class="app-nav">
    <div class="app-nav-inner">
      <div class="app-brand">
        <button class="sidebar-toggle" data-sidebar-toggle aria-label="Open navigation">☰</button>
        <a class="app-logo" href="dashboard.html" aria-label="PostBloom home"></a>
        <span class="workspace-name">Bloom Labs Creator Team</span>
      </div>
      <div class="app-nav-actions">
        <button class="icon-button" aria-label="Notifications">🔔<span class="notification-badge">6</span></button>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">🌙</button>
        <div class="avatar-menu">
          <button class="avatar-button" data-avatar-menu aria-label="Open user menu">AK</button>
          <div class="dropdown-menu">
            <a href="#">Profile</a>
            <a href="#">Settings</a>
            <a href="../index.html">Logout</a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <div class="app-shell">
    <div class="app-layout">
      <aside class="sidebar glass">
        <div class="sidebar-nav">
          <a class="sidebar-link" href="dashboard.html">📊 Dashboard</a>
          <a class="sidebar-link" href="opportunities.html">🔥 Opportunity Feed</a>
          <a class="sidebar-link active" href="campaign-new.html">🗂️ Campaigns</a>
          <a class="sidebar-link" href="team.html">👥 Team</a>
          <a class="sidebar-link" href="import.html">⬆️ Import Analytics</a>
        </div>
      </aside>

      <main class="app-main">
        <header class="page-header">
          <div>
            <div class="breadcrumb"><a href="opportunities.html">Opportunities</a> → New Campaign</div>
            <h1>Create Campaign</h1>
            <p>Package a high-performing LinkedIn source post into assigned platform deliverables.</p>
          </div>
        </header>

        <form class="form-card glass" id="campaignForm">
          <div class="form-grid">
            <div class="field">
              <label for="campaignName">Campaign Name</label>
              <input id="campaignName" type="text" value="Creator Ops Expansion Sprint">
            </div>
            <div class="field">
              <label for="campaignDescription">Campaign Description</label>
              <textarea id="campaignDescription">Expand this LinkedIn source post into a cross-platform campaign for creator team operators.</textarea>
            </div>
            <div>
              <div class="field-label">Target Platforms</div>
              <div class="checkbox-grid">
                <label class="checkbox-tile"><input type="checkbox" data-platform-check value="📸 Instagram Carousel" checked> 📸 Instagram Carousel</label>
                <label class="checkbox-tile"><input type="checkbox" data-platform-check value="🎬 YouTube Short" checked> 🎬 YouTube Short</label>
                <label class="checkbox-tile"><input type="checkbox" data-platform-check value="🎵 TikTok/Reel"> 🎵 TikTok/Reel</label>
                <label class="checkbox-tile"><input type="checkbox" data-platform-check value="🧵 Threads/X Thread" checked> 🧵 Threads/X Thread</label>
              </div>
            </div>
            <div>
              <div class="field-label">Assignments</div>
              <div class="assignment-list" id="assignmentList"></div>
            </div>
            <button class="btn btn-primary" type="submit">Create Campaign</button>
          </div>
        </form>
      </main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
