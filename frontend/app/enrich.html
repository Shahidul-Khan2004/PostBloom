<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PostBloom Enrich Source Post</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="app.css">
</head>
<body class="app-body" data-page="enrich">
  <div class="mobile-overlay"></div>
  <nav class="app-nav">
    <div class="app-nav-inner">
      <div class="app-brand">
        <button class="sidebar-toggle" data-sidebar-toggle aria-label="Open navigation">☰</button>
        <a class="app-logo" href="dashboard.html" aria-label="PostBloom home"></a>
        <span class="workspace-name">Bloom Labs Creator Team</span>
      </div>
      <div class="app-nav-actions">
        <button class="icon-button" aria-label="Notifications">🔔<span class="notification-badge">6</span></button>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">🌙</button>
        <div class="avatar-menu">
          <button class="avatar-button" data-avatar-menu aria-label="Open user menu">AK</button>
          <div class="dropdown-menu">
            <a href="profile.html">Profile</a>
            <a href="#">Settings</a>
            <a href="../index.html">Logout</a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <div class="app-shell">
    <div class="app-layout">
      <aside class="sidebar glass">
        <div class="sidebar-nav">
          <a class="sidebar-link" href="dashboard.html">📊 Dashboard</a>
          <a class="sidebar-link active" href="opportunities.html">🔥 Opportunity Feed</a>
          <a class="sidebar-link" href="campaign-new.html">🗂️ Campaigns</a>
          <a class="sidebar-link" href="team.html">👥 Team</a>
          <a class="sidebar-link" href="import.html">⬆️ Import Analytics</a>
        </div>
      </aside>

      <main class="app-main">
        <header class="page-header">
          <div>
            <div class="breadcrumb"><a href="opportunities.html">Opportunities</a> → Enrich Source</div>
            <h1>Source Post Enrichment</h1>
            <p>Add missing context before creating campaign deliverables for the team.</p>
          </div>
        </header>

        <section class="split-grid enrich-layout">
          <aside>
            <div class="metrics-grid enrich-metrics" id="enrichMetrics"></div>
          </aside>

          <form class="form-card glass" id="enrichForm">
            <div class="form-grid">
              <div class="field">
                <label for="enrichmentTitle">Source title</label>
                <input id="enrichmentTitle" name="title" type="text" required maxlength="500" placeholder="Short headline for this source post">
              </div>
              <div class="field">
                <label for="enrichmentExcerpt">Post text</label>
                <textarea id="enrichmentExcerpt" name="excerpt" maxlength="5000" placeholder="Paste the LinkedIn post copy"></textarea>
              </div>
              <div class="field">
                <label for="enrichmentNotes">Notes for team</label>
                <textarea id="enrichmentNotes" name="notes" maxlength="5000" placeholder="Creative direction, constraints, or audience notes"></textarea>
              </div>
              <div class="error-card" id="enrichFormError" role="alert"></div>
              <button class="btn btn-primary" type="submit">Save &amp; Create Campaign →</button>
            </div>
          </form>
        </section>
      </main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
