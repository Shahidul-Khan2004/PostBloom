services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postbloom
      POSTGRES_PASSWORD: postbloom
      POSTGRES_DB: postbloom
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/schemas/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postbloom -d postbloom"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
